name: Life OS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: life_os_test
          POSTGRES_PASSWORD: life_os_test_only
          POSTGRES_DB: life_os_auth_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U life_os_test -d life_os_auth_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:generate && git diff --exit-code -- packages/database/migrations
      - run: pnpm exec vitest run packages/api/src/auth-inbox.test.ts
        env:
          LIFE_OS_TEST_DATABASE_URL: postgresql://life_os_test:life_os_test_only@127.0.0.1:5432/life_os_auth_tests
      - run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U life_os_test -d life_os_auth_tests -c 'CREATE DATABASE life_os_e2e'
      - run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U life_os_test -d life_os_auth_tests -c 'CREATE DATABASE life_os_direction_tests'
      - run: pnpm exec vitest run packages/api/src/direction.test.ts
        env:
          LIFE_OS_DIRECTION_TEST_DATABASE_URL: postgresql://life_os_test:life_os_test_only@127.0.0.1:5432/life_os_direction_tests
      - run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U life_os_test -d life_os_auth_tests -c 'CREATE DATABASE life_os_tasks_tests'
      - run: pnpm exec vitest run packages/api/src/tasks.test.ts
        env:
          LIFE_OS_TASKS_TEST_DATABASE_URL: postgresql://life_os_test:life_os_test_only@127.0.0.1:5432/life_os_tasks_tests
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          LIFE_OS_E2E_DATABASE_URL: postgresql://life_os_test:life_os_test_only@127.0.0.1:5432/life_os_e2e
      - run: pnpm peers check
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
