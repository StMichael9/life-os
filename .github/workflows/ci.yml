name: Life OS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: life_os_test
          POSTGRES_PASSWORD: life_os_test_only
          POSTGRES_DB: life_os_auth_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U life_os_test -d life_os_auth_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:generate && git diff --exit-code -- packages/database/migrations
      - run: pnpm exec vitest run packages/api/src/auth-inbox.test.ts
        env:
          LIFE_OS_TEST_DATABASE_URL: postgresql://life_os_test:life_os_test_only@127.0.0.1:5432/life_os_auth_tests
      - run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U life_os_test -d life_os_auth_tests -c 'CREATE DATABASE life_os_e2e'
      - run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U life_os_test -d life_os_auth_tests -c 'CREATE DATABASE life_os_direction_tests'
      - run: pnpm exec vitest run packages/api/src/direction.test.ts
        env:
          LIFE_OS_DIRECTION_TEST_DATABASE_URL: postgresql://life_os_test:life_os_test_only@127.0.0.1:5432/life_os_direction_tests
      - run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U life_os_test -d life_os_auth_tests -c 'CREATE DATABASE life_os_tasks_tests'
      - run: pnpm exec vitest run packages/api/src/tasks.test.ts
        env:
          LIFE_OS_TASKS_TEST_DATABASE_URL: postgresql://life_os_test:life_os_test_only@127.0.0.1:5432/life_os_tasks_tests
      - run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U life_os_test -d life_os_auth_tests -c 'CREATE DATABASE life_os_execution_tests'
      - run: pnpm exec vitest run packages/api/src/execution.test.ts
        env:
          LIFE_OS_EXECUTION_TEST_DATABASE_URL: postgresql://life_os_test:life_os_test_only@127.0.0.1:5432/life_os_execution_tests
      - run: pnpm build
      - name: Prepare disposable release databases and PostgreSQL 17 clients
        env:
          FIXTURE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for database in life_os_release_tests life_os_release_restore life_os_smoke_tests; do
            docker exec "$FIXTURE_CONTAINER" psql -U life_os_test -d life_os_auth_tests -c "CREATE DATABASE $database"
          done
          python3 - <<'PY'
          import os, pathlib, re
          container = os.environ['FIXTURE_CONTAINER']
          assert re.fullmatch(r'[a-f0-9]+', container)
          for binary in ['pg_dump', 'pg_restore']:
              wrapper = pathlib.Path('/tmp/life-os-' + binary)
              wrapper.write_text('#!/bin/sh\nexec env PGPORT=5432 docker exec -i -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE -e PGSSLROOTCERT ' + container + ' ' + binary + ' "$@"\n')
              wrapper.chmod(0o700)
          PY
      - name: Verify release roles and encrypted backup/restore
        run: pnpm exec vitest run packages/database/src/operations.test.ts
        env:
          LIFE_OS_RELEASE_TEST_DATABASE_URL: postgresql://life_os_test:life_os_test_only@127.0.0.1:5432/life_os_release_tests
          LIFE_OS_RESTORE_TEST_DATABASE_URL: postgresql://life_os_test:life_os_test_only@127.0.0.1:5432/life_os_release_restore
          PG_DUMP_BIN: /tmp/life-os-pg_dump
          PG_RESTORE_BIN: /tmp/life-os-pg_restore
      - name: Rehearse production Next daily workflow over verified local HTTPS
        run: pnpm exec vitest run packages/database/src/release-smoke.test.ts
        env:
          LIFE_OS_SMOKE_TEST_DATABASE_URL: postgresql://life_os_test:life_os_test_only@127.0.0.1:5432/life_os_smoke_tests
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          LIFE_OS_E2E_DATABASE_URL: postgresql://life_os_test:life_os_test_only@127.0.0.1:5432/life_os_e2e
      - run: pnpm peers check
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
